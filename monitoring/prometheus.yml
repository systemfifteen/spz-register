global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spz'
    static_configs:
      - targets: ['spz:8000']
    metrics_path: '/metrics'

  - job_name: 'crowdsec'
    static_configs:
      - targets: ['crowdsec:6060']
        labels:
          machine: kocka

  # HW metriky kocky – prometheus-node-exporter (Debian balík) na hoste, port 9100
  # povolený v UFW iba zo siete proxy (172.19.0.0/16); 172.19.0.1 = brána siete proxy
  - job_name: 'node'
    static_configs:
      - targets: ['172.19.0.1:9100']
        labels:
          machine: kocka
    relabel_configs:
      - target_label: instance
        replacement: kocka
